# Checks on every push. On main: release builds (Linux AppImage + tarball, Windows setup, macOS DMG; experimental iOS
# and tvOS IPAs and Android APK) when there are releasable commits (feat/fix/perf; tools/ci/semantic-release.toml),
# published as a GitLab release whose packages stay in this project's package registry. With DOWNLOADS_BUCKET set,
# the player packages also go to the private download site (tools/ci/publish_downloads.py), which only invited players can open; nothing is
# public apart from its releases JSON.
#
# The build needs the game executable, which is never in this repo: tools/ci/gitlab_build.sh reads it from the private
# assets project (ASSETS_PROJECT) with the job token, which only this project's jobs may use there (its job token
# allowlist). Codegen output stored there (tools/ci/codegen_publish.sh) saves the half-hour codegen run, and each
# runner keeps a ccache per platform (CCACHE_DIR, tools/ci/build.sh), so an unchanged codegen key also skips compiling
# the generated code. Both hold game-derived objects: they stay on this instance's runners.
#
# Only the newest commit builds: build jobs are interruptible, so a newer pipeline on the branch cancels them
# (workflow:auto_cancel). The release job isn't, and releases run one at a time.
#
# Linux and Windows run on a runner whose executor is Docker with the host's Docker socket: build jobs build their image
# there (cached) and run it next to the job container, sharing its build directory. macOS needs an Apple silicon Mac:
# a shell-executor runner tagged `macos` with the Xcode command line tools, cmake, ninja and ccache on its PATH, and
# CCACHE_DIR set in its job environment. n1 (n1/, Rust) builds in every job: the images carry a Rust toolchain
# (docker/*/Dockerfile; docker/android with the Android targets), and on the Mac the build scripts use the user's
# rustup, installing it (user-local) if absent and adding the iOS target or, for tvOS, the rust-src component
# (tools/rust_env.sh).
#
# Run a pipeline on main with BUILD=1 to build (and upload as skullburglar/<last>-dev.<sha>) without releasing.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, plan, build, release]

variables:
  ASSETS_PROJECT: $CI_PROJECT_NAMESPACE/skullburglar-assets
  PSR: semantic-release -c tools/ci/semantic-release.toml

checks:
  stage: check
  image: python:3.12
  interruptible: true
  script:
    - python3 tools/leak_scan.py tree
    - d=$(mktemp -d) && c++ -std=c++20 -Wall -Werror -I src tests/input_math_test.cpp -o $d/t && $d/t
    - d=$(mktemp -d) && c++ -std=c++20 -Wall -Werror -I src tests/fps_math_test.cpp -o $d/t && $d/t
    - d=$(mktemp -d) && c++ -std=c++20 -Wall -Werror -I src tests/update_test.cpp src/setup/update_logic.cpp src/setup/ed25519.cpp -o $d/t && $d/t
    - python3 tests/ed25519_vectors.py
    - python3 tests/update_signing_test.py
    - d=$(mktemp -d) && c++ -std=c++20 -Wall -Werror -I src -c src/setup/update_install.cpp -o $d/i.o
    - d=$(mktemp -d) && c++ -std=c++20 -Wall -Werror -I src tests/path_utf8_test.cpp -o $d/t && $d/t
    - >-
      for f in tools/ci/*.sh tools/rust_env.sh tools/ios/build.sh tools/android/build.sh packaging/linux/AppRun;
      do sh -n "$f"; done
    - python3 -m py_compile tools/ci/gitlab_release.py tools/ci/publish_downloads.py tools/ci/check_signing_key.py tools/ci/update_signing.py
    - SUBMODULES=0 tools/ci/sdk.sh "$(mktemp -d)/sdk"

.main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The desktop builds also run on release/* branches (a release MR's full build before merging): they build into
# skullburglar-branch/0.0.0-branch.<sha>. So do the experimental mobile builds (below).
.desktop:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//

.psr:
  image: python:3.12
  variables:
    GIT_DEPTH: 0
  before_script:
    - pip install -q --root-user-action=ignore python-semantic-release==10.6.2
    # semantic-release reads the branch name; CI checks out a detached HEAD.
    - git checkout -q -B "$CI_COMMIT_BRANCH"

plan:
  stage: plan
  extends: [.main, .psr]
  interruptible: true
  script:
    - next=$($PSR version --print)
    - last=$($PSR version --print-last-released 2>/dev/null || true)
    - |
      if [ "$next" != "$last" ]; then
        echo "Next release: v$next"
        printf 'VERSION=%s\nLAST=%s\nRELEASE=true\n' "$next" "$last" > plan.env
      else
        echo "No releasable commits since ${last:+v}${last:-the start}."
        printf 'VERSION=%s\nLAST=%s\nRELEASE=false\n' "${last:-0.0.0}-dev.$CI_COMMIT_SHORT_SHA" "$last" > plan.env
      fi
  artifacts:
    reports:
      dotenv: plan.env

.build:
  stage: build
  extends: .desktop
  needs:
    - job: plan
      optional: true
  image: docker:29-cli
  interruptible: true
  timeout: 4h
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        export VERSION=0.0.0-branch.$CI_COMMIT_SHORT_SHA PACKAGE=skullburglar-branch
      elif [ "$RELEASE" != true ] && [ "${BUILD:-}" != 1 ]; then
        echo "Nothing to release: not building."
        exit 0
      fi
      PACKAGE=${PACKAGE:-skullburglar}
    - docker build -q -t "skullburglar-ci-$PLATFORM" "docker/$IMAGE"
    # This job's container, whose volumes (the checkout) the build container shares.
    - JOB=$(docker ps -q --filter "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" --filter "label=com.gitlab.gitlab-runner.type=build")
    - test -n "$JOB"
    - >-
      docker run --rm --name "skullburglar-ci-$CI_JOB_ID" --volumes-from "$JOB" -w "$CI_PROJECT_DIR"
      -e CI_JOB_TOKEN -e CI_SERVER_HOST -e CI_API_V4_URL -e CI_PROJECT_ID -e VERSION -e PACKAGE -e ASSETS_PROJECT -e UPDATE_URL
      -e CCACHE_DIR=/ccache -v "skullburglar-ccache-$PLATFORM:/ccache"
      "skullburglar-ci-$PLATFORM" tools/ci/gitlab_build.sh "$PLATFORM"
  after_script:
    # A cancelled job leaves its build container running otherwise.
    - docker rm -f "skullburglar-ci-$CI_JOB_ID" >/dev/null 2>&1 || true

build:linux:
  extends: .build
  variables:
    PLATFORM: linux
    IMAGE: linux-steamrt

build:windows:
  extends: .build
  variables:
    PLATFORM: windows
    IMAGE: win-cross

build:macos:
  stage: build
  extends: .desktop
  needs:
    - job: plan
      optional: true
  tags: [macos]
  interruptible: true
  timeout: 4h
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        export VERSION=0.0.0-branch.$CI_COMMIT_SHORT_SHA PACKAGE=skullburglar-branch
      elif [ "$RELEASE" != true ] && [ "${BUILD:-}" != 1 ]; then
        echo "Nothing to release: not building."
        exit 0
      fi
    - tools/ci/gitlab_build.sh macos

# iOS and tvOS (experimental, tools/ios/build.sh): unsigned IPAs, signed when they're installed. On main they build with
# the others when there's a release (or BUILD=1) and go in it as skullburglar-<VERSION>-<ios|tvos>.ipa; they may fail
# without holding up the release, which then leaves them out. On branches named for them (apple, ios, tvos), and on
# release/* branches with the desktop builds, they build on every push into skullburglar-apple/apple-<sha>.
# They need a Mac runner with Xcode and its iOS and tvOS platforms (the command line tools have no iOS SDKs), tagged
# `xcode` as well as `macos`. DEVELOPER_DIR picks the full Xcode for these jobs only, so the runner's selected developer
# directory can stay on the command line tools the macOS build uses.
.apple:
  stage: build
  tags: [macos, xcode]
  variables:
    DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  needs:
    - job: plan
      optional: true
  interruptible: true
  allow_failure: true
  timeout: 4h
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)(apple|ios|tvos)/
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        VERSION=apple-$CI_COMMIT_SHORT_SHA PACKAGE=skullburglar-apple tools/ci/gitlab_build.sh "$PLATFORM"
      elif [ "$RELEASE" = true ] || [ "${BUILD:-}" = 1 ]; then
        tools/ci/gitlab_build.sh "$PLATFORM"
      else
        echo "Nothing to release: not building."
      fi

build:ios:
  extends: .apple
  variables:
    PLATFORM: ios

build:tvos:
  extends: .apple
  variables:
    PLATFORM: tvos

# Android (experimental, tools/android/build.sh): an arm64 APK. On main it builds with the others when there's a release
# (or BUILD=1) and goes in it as skullburglar-<VERSION>-android.apk, signed with the ANDROID_KEYSTORE file variable; like
# iOS it may fail without holding up the release, which then leaves it out. On branches named for it (android), and on
# release/* branches, it builds on every push into skullburglar-android/android-<sha>, debug-signed. Runs on the Docker
# runner like the Linux and Windows builds (image docker/android).
build:android:
  stage: build
  needs:
    - job: plan
      optional: true
  image: docker:29-cli
  interruptible: true
  allow_failure: true
  timeout: 4h
  variables:
    PLATFORM: android
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /(^|\/)android/
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        export VERSION=android-$CI_COMMIT_SHORT_SHA PACKAGE=skullburglar-android
      elif [ "$RELEASE" != true ] && [ "${BUILD:-}" != 1 ]; then
        echo "Nothing to release: not building."
        exit 0
      fi
      export PACKAGE=${PACKAGE:-skullburglar}
    - docker build -q -t skullburglar-ci-android docker/android
    - JOB=$(docker ps -q --filter "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" --filter "label=com.gitlab.gitlab-runner.type=build")
    - test -n "$JOB"
    - >-
      docker run --rm --name "skullburglar-ci-$CI_JOB_ID" --volumes-from "$JOB" -w "$CI_PROJECT_DIR"
      -e CI_JOB_TOKEN -e CI_SERVER_HOST -e CI_API_V4_URL -e CI_PROJECT_ID -e VERSION -e PACKAGE -e ASSETS_PROJECT
      -e ANDROID_KEYSTORE -e ANDROID_KEYSTORE_PASS
      -e CCACHE_DIR=/ccache -v "skullburglar-ccache-android:/ccache"
      skullburglar-ci-android tools/ci/gitlab_build.sh android
  after_script:
    - docker rm -f "skullburglar-ci-$CI_JOB_ID" >/dev/null 2>&1 || true

release:
  stage: release
  extends: [.main, .psr]
  needs: [plan, build:linux, build:windows, build:macos, build:ios, build:tvos, build:android]
  resource_group: release
  script:
    - |
      if [ "$RELEASE" != true ]; then
        echo "Nothing to release."
        exit 0
      fi
    - next=$($PSR version --print)
    - |
      if [ "$next" != "$VERSION" ]; then
        echo "Built as $VERSION, but the next release is now $next (a release was made meanwhile)."
        exit 1
      fi
    # Before anything is tagged: a missing or mismatched signing key must not leave a release without its downloads.
    - |
      if [ -n "${DOWNLOADS_BUCKET:-}" ]; then
        python3 tools/ci/check_signing_key.py
      fi
    - python3 tools/ci/gitlab_release.py
    - |
      if [ -n "${DOWNLOADS_BUCKET:-}" ]; then
        pip install -q --root-user-action=ignore "boto3>=1.35"
        python3 tools/ci/publish_downloads.py
      fi
